name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Real SQL Server for tests the in-memory provider can't cover (transactions, locks, retries).
    # Throwaway container that only lives during the job, so this password is not a secret.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Ci-Throwaway-Pass1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci-Throwaway-Pass1 -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      VETMANAGEMENT_TEST_SQLSERVER: Server=localhost,1433;User Id=sa;Password=Ci-Throwaway-Pass1;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Projects are restored individually instead of the .sln: the MAUI project
      # (src/VetManagement.Staff.Maui) targets android/ios/windows TFMs and requires
      # platform workloads, so it is neither restored nor built on Linux runners.
      - name: Restore
        run: |
          dotnet restore tests/VetManagement.Tests/VetManagement.Tests.csproj
          dotnet restore src/VetManagement.Staff.Web/VetManagement.Staff.Web.csproj
          dotnet restore src/VetManagement.Booking.Web/VetManagement.Booking.Web.csproj

      - name: Build backend + tests (Api, Application, Infrastructure, Domain, Contracts, Staff.UI)
        run: dotnet build tests/VetManagement.Tests/VetManagement.Tests.csproj --no-restore

      - name: Build staff web client
        run: dotnet build src/VetManagement.Staff.Web/VetManagement.Staff.Web.csproj --no-restore

      - name: Build public booking portal
        run: dotnet build src/VetManagement.Booking.Web/VetManagement.Booking.Web.csproj --no-restore

      - name: Test
        run: dotnet test tests/VetManagement.Tests/VetManagement.Tests.csproj --no-restore --no-build --verbosity minimal