name: Deploy to Azure

# Run by hand (Actions → Deploy to Azure → Run workflow) for one clinic. Everything clinic-specific lives in a GitHub
# Environment named after the clinic (Settings → Environments), never in this file:
#   variables: AZURE_API_APP_NAME   App Service name of the API
#              API_BASE_URL         public URL of the API, e.g. https://api.example.cl/
#              STAFF_CULTURE        optional: staff UI language and formats, e.g. es-CL (absent = English)
#   secrets:   AZURE_API_PUBLISH_PROFILE   App Service → Download publish profile
#              AZURE_STAFF_SWA_TOKEN       Static Web App → Manage deployment token
# The API's own settings (connection string, JWT, CORS...) are App Service settings: see docs/DEPLOYMENT.md.
# The API applies pending database migrations on start-up.
#
# A clinic's private repository can run it instead (workflow_call), so the environment, its secrets and the run logs
# (which show resource names and URLs) stay private: its workflow calls this file with the environment name, this
# repository and the ref to deploy, and `secrets: inherit`. The environment then lives in that repository.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment of the clinic (e.g. my-clinic)
        required: true
        type: string
      deploy_api:
        description: Deploy the API
        type: boolean
        default: true
      deploy_staff_web:
        description: Deploy the staff web
        type: boolean
        default: true
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment of the clinic, in the calling repository
        required: true
        type: string
      repository:
        description: Repository of this code (the caller's own repository is the default)
        type: string
        default: ''
      ref:
        description: Branch, tag or commit to deploy
        type: string
        default: ''
      deploy_api:
        type: boolean
        default: true
      deploy_staff_web:
        type: boolean
        default: true

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.code.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
      # The deploy jobs check out this same commit, so what is deployed is what was tested.
      - id: code
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Same projects as CI (the MAUI app needs platform workloads and isn't built on Linux).
      - run: dotnet test tests/VetManagement.Tests/VetManagement.Tests.csproj

  api:
    if: inputs.deploy_api
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ needs.test.outputs.sha }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet publish src/VetManagement.Api/VetManagement.Api.csproj -c Release -o publish/api
      - uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: publish/api

  staff-web:
    if: inputs.deploy_staff_web
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ needs.test.outputs.sha }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet publish src/VetManagement.Staff.Web/VetManagement.Staff.Web.csproj -c Release -o publish/staff
      # config.json is ignored by git (each install has its own): written here from the clinic's environment.
      - name: Write config.json
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          STAFF_CULTURE: ${{ vars.STAFF_CULTURE }}
        run: |
          test -n "$API_BASE_URL" || { echo "Set the API_BASE_URL variable in the '${{ inputs.environment }}' environment."; exit 1; }
          printf '{ "ApiBaseUrl": "%s", "Culture": "%s" }\n' "$API_BASE_URL" "$STAFF_CULTURE" > publish/staff/wwwroot/config.json
          # A precompressed copy would be served instead of the file just written.
          rm -f publish/staff/wwwroot/config.json.br publish/staff/wwwroot/config.json.gz
      # The repository's index.html lets the page connect to any https site and to localhost (development); the
      # published one connects only to itself and this clinic's API (https for calls, wss for the realtime hubs).
      - name: Limit the page's connections to the API
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          api_origin=$(printf '%s' "$API_BASE_URL" | sed -E 's#^(https?://[^/]+).*#\1#')
          ws_origin=$(printf '%s' "$api_origin" | sed -E 's#^http#ws#')
          sed -i "s#connect-src 'self' https: http://localhost:\* https://localhost:\* ws: wss:#connect-src 'self' $api_origin $ws_origin#" publish/staff/wwwroot/index.html
          grep -q "connect-src 'self' $api_origin $ws_origin;" publish/staff/wwwroot/index.html || { echo "index.html: the Content-Security-Policy was not updated."; exit 1; }
          rm -f publish/staff/wwwroot/index.html.br publish/staff/wwwroot/index.html.gz
      - uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STAFF_SWA_TOKEN }}
          action: upload
          app_location: publish/staff/wwwroot
          skip_app_build: true
