# Weekly pull requests for outdated NuGet packages and GitHub Actions (the workflows pin actions by commit; the
# comment after each one says its version). Minor and patch updates come grouped in one pull request.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # ASP.NET Core 10's OpenAPI source generator needs Microsoft.OpenApi 2.x: with 3.x its generated code doesn't
    # compile. Major updates wait until ASP.NET Core supports them.
    ignore:
      - dependency-name: Microsoft.OpenApi
        update-types: ["version-update:semver-major"]
      # These packages carry the .NET version the app targets (10, long-term support): their next major arrives with
      # the move to that .NET, as one change, not as weekly pull requests. Other packages keep their major updates.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Maui.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Security.Cryptography.*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
